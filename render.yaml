services:
  - type: web
    name: hanoi-pm25-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build:shared && npm run build:api
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: ENABLE_BACKGROUND_SCHEDULER
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: OPENAQ_API_KEY
        sync: false
      - key: WAQI_API_TOKEN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false

